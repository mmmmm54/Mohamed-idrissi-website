:root{--blue:#2a37dd;--ink:#14213d;--ink-soft:#4c596f;--white:#fff}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#0e1633;font-family:'Bricolage Grotesque',sans-serif}
.wall{position:absolute;inset:-90px -60px;display:grid;grid-template-columns:repeat(7,1fr);gap:14px;transform:rotate(-7deg)}
.wall figure{position:relative}
.wall img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;display:block}
.wall figure:nth-child(7n+2),.wall figure:nth-child(7n+4),.wall figure:nth-child(7n+6){transform:translateY(-80px)}
/* Video stills: a small play badge, so the wall says "motion" too. */
.wall figure.v::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.wall figure.v::before{content:"";position:absolute;left:50%;top:50%;z-index:1;margin:-9px 0 0 -5px;border-left:16px solid var(--blue);border-top:9px solid transparent;border-bottom:9px solid transparent}
/* Light, blue-tinted shade: the work stays bright, the card still stands out. */
.shade{position:absolute;inset:0;background:radial-gradient(42% 60% at 50% 50%,rgba(14,22,51,.55),rgba(14,22,51,.12) 70%),linear-gradient(rgba(42,55,221,.10),rgba(42,55,221,.10))}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:500px;padding:32px 40px 30px;border-radius:30px;background:var(--white);text-align:center;box-shadow:0 0 0 8px rgba(255,255,255,.18),0 40px 90px rgba(5,8,30,.55)}
.logo{width:84px;height:auto;margin:0 auto 12px;display:block}
h1{color:var(--ink);font-size:56px;line-height:.95;letter-spacing:-.05em;font-weight:800}
h1 span{color:var(--blue)}
.role{margin-top:12px;color:var(--ink-soft);font-size:19px;font-weight:500;letter-spacing:-.01em}
.tags{margin-top:16px;display:flex;justify-content:center;gap:8px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tags b{padding:7px 12px;border-radius:999px;background:#eef0ff;color:var(--blue)}
.url{display:inline-block;margin-top:18px;padding:12px 24px;border-radius:999px;background:var(--blue);color:var(--white);font-family:'Space Mono',monospace;font-size:19px;font-weight:700;letter-spacing:.02em;box-shadow:0 10px 24px rgba(42,55,221,.35)}
</style>
